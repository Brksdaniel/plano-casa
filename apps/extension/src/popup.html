<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DENIELS HOME TRACKER</title>
    <style>
      body { margin: 0; width: 300px; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2233; background: #fafbfc; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e8e9ef; background: #fff; }
      .logo { width: 30px; height: 30px; border-radius: 9px; background: #5b4ff5; color: #fff; display: grid; place-items: center; font-weight: 700; }
      header b { display: block; font-size: 14px; letter-spacing: -.01em; }
      header small { color: #6b6f80; font-size: 10px; letter-spacing: .16em; }
      main { padding: 14px 16px 16px; }
      .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa0b4; }
      .ok .dot { background: #0f9d58; } .warn .dot { background: #d29a00; }
      p { margin: 6px 0 14px; color: #6b6f80; font-size: 13px; }
      a.btn { display: block; text-align: center; text-decoration: none; padding: 9px 12px; border-radius: 10px; font-weight: 600; background: #5b4ff5; color: #fff; }
      a.btn.secondary { background: #fff; color: #1f2233; border: 1px solid #e0e2ea; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header><div class="logo">D</div><div><b>DENIELS</b><small>HOME TRACKER</small></div></header>
    <main>
      <div id="status" class="status"><span class="dot"></span><span id="label">Verificando…</span></div>
      <p id="detail"></p>
      <a id="primary" class="btn" target="_blank" rel="noopener">Abrir o Deniels</a>
      <a id="secondary" class="btn secondary" target="_blank" rel="noopener">Configurações</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
